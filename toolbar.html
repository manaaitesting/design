<title>Toolbar — test page</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: #fcfcfc;
    font: 400 11px/1.4 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    color: rgba(0, 0, 0, 0.898);
    -webkit-font-smoothing: antialiased;
  }
  /* a hairline standing in for the canvas edge in the reference shots */
  .canvas { position: fixed; inset: 0; border-top: 1px solid #e6e6e6; top: 64px; }
  .hint {
    position: fixed; top: 22px; left: 0; right: 0;
    text-align: center; color: rgba(0, 0, 0, 0.4);
  }
  .hint b { font-weight: 550; color: rgba(0, 0, 0, 0.6); }

  /* ─── the bar ──────────────────────────────────────────────────────── */
  .toolbar {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    height: 48px;
    padding: 0 6px;
    background: #fff;
    border-radius: 13px;
    box-shadow:
      0 0 0 0.5px rgba(0, 0, 0, 0.08),
      0 2px 7px rgba(0, 0, 0, 0.10),
      0 6px 24px rgba(0, 0, 0, 0.10);
    user-select: none;
  }

  /* A slot is the icon plus its own caret, so the two read as one control. */
  .slot { display: flex; align-items: center; }
  .tool, .caret, .icon-btn {
    display: grid;
    place-items: center;
    border: 0;
    background: transparent;
    color: rgba(0, 0, 0, 0.8);
    cursor: default;
    padding: 0;
    transition: background-color 80ms ease-out, color 80ms ease-out;
  }
  .tool { width: 34px; height: 34px; border-radius: 9px; }
  .tool:hover { background: rgba(0, 0, 0, 0.05); }
  .tool[aria-pressed='true'],
  .tool[aria-pressed='true']:hover { background: #0d99ff; color: #fff; }

  .caret { width: 15px; height: 34px; border-radius: 5px; color: rgba(0, 0, 0, 0.42); }
  .caret:hover { background: rgba(0, 0, 0, 0.05); color: rgba(0, 0, 0, 0.8); }
  .caret[aria-expanded='true'] { background: rgba(0, 0, 0, 0.08); color: rgba(0, 0, 0, 0.8); }
  /* a slot with no menu keeps the caret's width so the row stays evenly spaced */
  .caret.empty { visibility: hidden; }

  .divider { width: 1px; height: 24px; margin: 0 8px; background: rgba(0, 0, 0, 0.1); }

  .icon-btn { width: 32px; height: 32px; border-radius: 8px; }
  .icon-btn:hover { background: rgba(0, 0, 0, 0.05); }
  .icon-btn[aria-pressed='true'] { background: #e5f4ff; color: #0d99ff; }

  /* ─── the dropdown ─────────────────────────────────────────────────── */
  .menu {
    position: fixed;
    z-index: 20;
    min-width: 184px;
    padding: 6px;
    background: #1e1e1e;
    border-radius: 13px;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2), 0 8px 30px rgba(0, 0, 0, 0.35);
    color: #fff;
  }
  .menu[hidden] { display: none; }
  .row {
    display: grid;
    grid-template-columns: 16px 20px 1fr auto;
    align-items: center;
    gap: 8px;
    width: 100%;
    height: 32px;
    padding: 0 10px 0 6px;
    border: 0;
    border-radius: 5px;
    background: transparent;
    color: inherit;
    font: inherit;
    font-size: 12px;
    text-align: left;
    cursor: default;
  }
  .row:hover { background: #0d99ff; }
  .row .check { opacity: 0; }
  .row[aria-checked='true'] .check { opacity: 1; }
  .row .shortcut { color: rgba(255, 255, 255, 0.5); font-size: 12px; }
  .row:hover .shortcut { color: rgba(255, 255, 255, 0.85); }
  .row .glyph { display: grid; place-items: center; }

  svg { display: block; }
</style>
</head>

/* ── the bar's contents ─────────────────────────────────────────────────
   Each slot owns a list; the slot shows whichever item you last picked,
   which is why the icon on the bar changes after choosing from a menu. */
const SLOTS = [
  { id: 'move', items: [
      { label: 'Move',      shortcut: 'V', icon: 'move' },
      { label: 'Hand tool', shortcut: 'H', icon: 'hand' },
      { label: 'Scale',     shortcut: 'K', icon: 'scale' },
  ]},
  { id: 'frame', items: [
      { label: 'Frame',   shortcut: 'F',  icon: 'frame' },
      { label: 'Section', shortcut: '⇧S', icon: 'section' },
      { label: 'Slice',   shortcut: 'S',  icon: 'slice' },
  ]},
  { id: 'shapes', items: [
      { label: 'Rectangle',   shortcut: 'R',  icon: 'rect' },
      { label: 'Line',        shortcut: 'L',  icon: 'line' },
      { label: 'Arrow',       shortcut: '⇧L', icon: 'arrow' },
      { label: 'Ellipse',     shortcut: 'O',  icon: 'ellipse' },
      { label: 'Polygon',     shortcut: '',   icon: 'polygon' },
      { label: 'Star',        shortcut: '',   icon: 'star' },
      { label: 'Image/video…',shortcut: '⇧⌘K',icon: 'image' },
  ]},
  { id: 'pen', items: [
      { label: 'Pen',    shortcut: 'P',  icon: 'pen' },
      { label: 'Pencil', shortcut: '⇧P', icon: 'pencil' },
  ]},
  { id: 'text', items: [
      { label: 'Text',         shortcut: 'T', icon: 'text' },
      { label: 'Text on path', shortcut: '',  icon: 'textPath' },
  ]},
  { id: 'shape',   items: [{ label: 'Shape',   shortcut: '', icon: 'shape' }] },
  { id: 'actions', items: [{ label: 'Actions', shortcut: '', icon: 'actions' }] },
];

const RIGHT = [
  { id: 'annotate', label: 'Annotate', icon: 'annotate' },
  { id: 'inspect',  label: 'Inspect',  icon: 'inspect' },
  { id: 'plugin',   label: 'Plugins',  icon: 'plugin' },
  { id: 'code',     label: 'Code',     icon: 'code' },
];

/* ── state ─────────────────────────────────────────────────────────────── */
const chosen = Object.fromEntries(SLOTS.map((s) => [s.id, 0])); // current item per slot
let active = 'move';        // the highlighted tool slot
let rightActive = 'inspect';
let open = null;            // id of the slot whose menu is showing

const bar = document.getElementById('toolbar');
const menu = document.getElementById('menu');

function renderBar() {
  bar.replaceChildren();

  for (const slot of SLOTS) {
    const item = slot.items[chosen[slot.id]];
    const wrap = document.createElement('div');
    wrap.className = 'slot';

    const tool = document.createElement('button');
    tool.className = 'tool';
    tool.type = 'button';
    tool.title = item.shortcut ? `${item.label}  ${item.shortcut}` : item.label;
    tool.setAttribute('aria-pressed', String(active === slot.id));
    tool.innerHTML = svg(item.icon, 20);
    tool.onclick = () => { active = slot.id; close(); renderBar(); };

    const caret = document.createElement('button');
    caret.className = 'caret' + (slot.items.length > 1 ? '' : ' empty');
    caret.type = 'button';
    caret.setAttribute('aria-haspopup', 'menu');
    caret.setAttribute('aria-expanded', String(open === slot.id));
    caret.setAttribute('aria-label', `${item.label} options`);
    caret.innerHTML = caretGlyph;
    caret.onclick = (event) => {
      event.stopPropagation();
      open === slot.id ? close() : openMenu(slot, wrap);
    };

    wrap.append(tool, caret);
    bar.append(wrap);
  }

  const rule = document.createElement('div');
  rule.className = 'divider';
  bar.append(rule);

  for (const entry of RIGHT) {
    const button = document.createElement('button');
    button.className = 'icon-btn';
    button.type = 'button';
    button.title = entry.label;
    button.setAttribute('aria-pressed', String(rightActive === entry.id));
    button.innerHTML = svg(entry.icon, 20);
    button.onclick = () => { rightActive = entry.id; renderBar(); };
    bar.append(button);
  }
}

function openMenu(slot, anchor) {
  open = slot.id;
  menu.replaceChildren();

  slot.items.forEach((item, index) => {
    const row = document.createElement('button');
    row.className = 'row';
    row.type = 'button';
    row.setAttribute('role', 'menuitemradio');
    row.setAttribute('aria-checked', String(chosen[slot.id] === index));
    row.innerHTML =
      `<span class="check">${checkGlyph}</span>` +
      `<span class="glyph">${svg(item.icon, 16)}</span>` +
      `<span>${item.label}</span>` +
      `<span class="shortcut">${item.shortcut}</span>`;
    row.onclick = () => {
      chosen[slot.id] = index;
      active = slot.id;
      close();
      renderBar();
    };
    menu.append(row);
  });

  menu.hidden = false;
  // Measure after it is in the DOM, then sit it above the anchor, nudged back
  // on-screen if the widest menu would otherwise run off the right edge.
  const box = anchor.getBoundingClientRect();
  const size = menu.getBoundingClientRect();
  const left = Math.min(
    Math.max(8, box.left - 4),
    window.innerWidth - size.width - 8,
  );
  menu.style.left = `${left}px`;
  menu.style.top = `${box.top - size.height - 10}px`;
  renderBar();
}

function close() {
  open = null;
  menu.hidden = true;
}

/* ── input ─────────────────────────────────────────────────────────────── */
document.addEventListener('click', (event) => {
  if (open && !menu.contains(event.target)) { close(); renderBar(); }
});
document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape' && open) { close(); renderBar(); return; }
  if (event.metaKey || event.ctrlKey || event.altKey) return;

  const typed = (event.shiftKey ? '⇧' : '') + event.key.toUpperCase();
  for (const slot of SLOTS) {
    const index = slot.items.findIndex((item) => item.shortcut === typed);
    if (index === -1) continue;
    chosen[slot.id] = index;
    active = slot.id;
    close();
    renderBar();
    return;
  }
});

renderBar();
</script>
</body>
</html>
